[project]
name = "jinchuan-python-webapi"
version = "0.1.0"
description = "Jinchuan local vision inference service for Tauri desktop integration"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "numpy>=1.18.0",
    "opencv-python>=4.5.0",
    "pillow>=8.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
    "pydantic>=2.11.0",
    "prometheus-client>=0.23.0",
    "requests>=2.25.0",
    "matplotlib>=3.3.0",
    "ipython>=7.0.0",
    "psutil>=5.8.0",
    "tqdm>=4.60.0",
    "thop>=0.1.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "lightgbm==4.6.0",
    "pycryptodome>=3.15.0",
    "ultralytics==8.4.66",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
